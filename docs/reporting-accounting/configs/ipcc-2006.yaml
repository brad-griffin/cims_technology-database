# Emissions by IPCC 2006 category (the UNFCCC layout of the National Inventory
# Report). For the economic-category layout ECCC also publishes, see nir-economic.yaml.
# Rules are tried in order; the first match wins. A match can test where the carbon
# was emitted (emitted_at), a process its carbon passed through (path_includes) and
# the purchased fuel it came from (fuel).
#
# IPCC 2006 Vol. 3 ch. 4.2: coke production is energy use (1.A); all carbon charged
# to the blast furnace is process (IPPU 2.C.1); by-product gases burned elsewhere
# follow the process they came from. Canada's NIR reports reductant coke under
# 2.C.1.b pig iron because the reductant share cannot be disaggregated - check NIR
# chapter 4 and Annex A1 before using this as the Canadian default.
name: IPCC 2006 categories
emissions:
  total_equals: emitted
  stored_carbon: none        # carbon left in tar and steel is not an emission
  rules:
    - match: {path_includes: blast-furnace}
      category: 2.C.1 Iron and steel production (IPPU)
    - match: {emitted_at: coke-ovens}
      category: 1.A.1.c.i Manufacture of solid fuels
    - match: {path_includes: coke-ovens}
      category: 1.A.2.a Iron and steel (combustion)
    - match: {}
      category: 1.A.2.a Iron and steel (combustion)
